# Language style fixtures for --style rust
# {timestamp} is replaced at emit time (see timestamp_format).
language: rust
description: Rust panic and backtrace output for multiline parser testing
timestamp_format: "%Y-%m-%dT%H:%M:%S.%3fZ"

info_messages:
  - '{timestamp} INFO api: GET /health -> 200'
  - '{timestamp} INFO worker: job=resize status=ok'
  - '{timestamp} DEBUG db: pool checkout ok'
  - '{timestamp} WARN cache: soft timeout key=session:***'

