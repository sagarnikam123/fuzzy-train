# Language style fixtures for --style java
# {timestamp} is replaced at emit time (see timestamp_format).
#
# Exception / Error coverage drawn from Java SE 8 docs:
#   https://docs.oracle.com/javase/8/docs/api/java/lang/Exception.html
#   https://docs.oracle.com/javase/8/docs/api/java/lang/Error.html
#   https://docs.oracle.com/javase/8/docs/api/java/lang/RuntimeException.html
#   https://docs.oracle.com/javase/8/docs/api/java/io/IOException.html
# Desktop/UI/MIDI/print-only types omitted (unlikely in app-server logs).
language: java
description: JVM exception and error stacks (log4j-style + nested causes)
timestamp_format: "%Y-%m-%d %H:%M:%S,%3f"

info_messages:
  - "{timestamp} INFO  [http-nio-8080-exec-2] com.example.api.HealthController - health check ok"
  - "{timestamp} INFO  [scheduling-1] com.example.jobs.CleanupJob - purged 12 expired sessions"
  - "{timestamp} DEBUG [http-nio-8080-exec-5] com.example.cart.CartService - cart id=c-1042 items=3"
  - "{timestamp} WARN  [http-nio-8080-exec-3] com.example.api.RateLimiter - soft limit approaching for apiKey=ak_***"

