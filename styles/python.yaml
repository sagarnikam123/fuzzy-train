# Language style fixtures for --style python
# {timestamp} is replaced at emit time (see timestamp_format).
#
# Built-in Exception / OSError coverage from:
#   https://docs.python.org/3/library/exceptions.html
#   https://docs.python.org/3/tutorial/errors.html
# Warning hierarchy omitted (not typical ERROR log lines).
# Control-flow BaseExceptions (SystemExit/GeneratorExit) omitted.
language: python
description: CPython tracebacks (logging + raw Traceback + chained)
timestamp_format: "%Y-%m-%d %H:%M:%S,%3f"

info_messages:
  - "{timestamp} INFO [app.api] GET /health 200 3ms"
  - "{timestamp} INFO [app.worker] job=resize_image status=ok duration_ms=42"
  - "{timestamp} DEBUG [app.db] checkout connection pool=primary"
  - "{timestamp} WARNING [app.cache] redis soft timeout key=session:***"

