# Language style fixtures for --style go
# {timestamp} is replaced at emit time (see timestamp_format).
#
# Go has no exception class tree — errors are values (error interface).
# Coverage drawn from:
#   https://pkg.go.dev/errors
#   https://go.dev/ref/spec#Errors
#   https://go.dev/wiki/Errors
#   https://go.dev/blog/error-handling-and-go
# Plus common runtime panics and stdlib sentinels (io/fs/os/net/context/sql/json).
language: go
description: Go panics, wrapped errors, and stdlib sentinel dumps for multiline parsers
timestamp_format: "%Y-%m-%dT%H:%M:%SZ"

info_messages:
  - 'ts={timestamp} level=info msg="HTTP request" method=GET path=/health status=200'
  - 'ts={timestamp} level=info msg="worker tick" job=reconcile ok=true'
  - 'ts={timestamp} level=debug msg="cache hit" key=session:***'
  - 'ts={timestamp} level=warn msg="retrying upstream" attempt=2 host=api.internal'

