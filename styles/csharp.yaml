# Language style fixtures for --style csharp
# {timestamp} is replaced at emit time (see timestamp_format).
language: csharp
description: .NET exception stacks for multiline parser testing
timestamp_format: "%Y-%m-%d %H:%M:%S.%3f +00:00"

info_messages:
