  - "{timestamp} [INF] Shop.Workers.CleanupJob: Purged 12 expired sessions"
  - "{timestamp} [DBG] Shop.Cart.CartService: Cart c-1042 has 3 items"
  - "{timestamp} [WRN] Shop.Api.RateLimiter: Soft limit approaching for apiKey=ak_***"

