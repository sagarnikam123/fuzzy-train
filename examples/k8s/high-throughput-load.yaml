apiVersion: v1
kind: Namespace
metadata:
  name: fuzzy-train
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzzy-train-load
  namespace: fuzzy-train
  labels:
    app: fuzzy-train-load
    app.kubernetes.io/name: fuzzy-train
    app.kubernetes.io/component: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fuzzy-train-load
  template:
    metadata:
      labels:
        app: fuzzy-train-load
        app.kubernetes.io/name: fuzzy-train
    spec:
      containers:
      - name: generator
        image: sagarnikam123/fuzzy-train:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--log-format"
          - "json"
          - "--lines-per-second"
          - "2000"
          - "--time-zone"
          - "utc"
          - "--output"
          - "stdout"
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "256Mi"
      restartPolicy: Always
