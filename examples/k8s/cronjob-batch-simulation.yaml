apiVersion: v1
kind: Namespace
metadata:
  name: fuzzy-train
  labels:
    name: fuzzy-train
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fuzzy-train-batch-simulation
  namespace: fuzzy-train
  labels:
    app: fuzzy-train-batch-simulation
    app.kubernetes.io/name: fuzzy-train
    app.kubernetes.io/component: batch-log-generator
spec:
  schedule: "*/5 * * * *"             # Runs every 5 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: fuzzy-train-batch-simulation
        spec:
          containers:
          - name: generator
            image: sagarnikam123/fuzzy-train:latest
            imagePullPolicy: IfNotPresent
            args:
              - "--count"
              - "500"                  # Emits 500 log lines per batch run
              - "--lines-per-second"
              - "50"                   # Fast batch throughput
              - "--log-format"
              - "json"
              - "--error-interval"
              - "1m"                   # Emits simulated errors
              - "--time-zone"
              - "utc"
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
          restartPolicy: OnFailure
