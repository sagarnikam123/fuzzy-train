apiVersion: v1
kind: Namespace
metadata:
  name: fuzzy-train
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzzy-train-multiline
  namespace: fuzzy-train
  labels:
    app: fuzzy-train-multiline
    app.kubernetes.io/name: fuzzy-train
    app.kubernetes.io/component: multiline-log-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fuzzy-train-multiline
  template:
    metadata:
      labels:
        app: fuzzy-train-multiline
        app.kubernetes.io/name: fuzzy-train
    spec:
      containers:
      - name: generator
        image: sagarnikam123/fuzzy-train:latest
        imagePullPolicy: IfNotPresent
        args:
          - "--stack"
          - "java"
          - "--error-interval"
          - "1m"                    # Emits a multi-line stack trace every 1 minute (adjust to 3m as desired)
          - "--lines-per-second"
          - "2"
          - "--time-zone"
          - "utc"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      restartPolicy: Always
